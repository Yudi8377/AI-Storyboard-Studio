<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#11131b"><title>Masuk · AI Storyboard Studio</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(100%,460px);padding:clamp(24px,5vw,42px);background:#191b25;border:1px solid #333644;border-radius:20px}.brand{display:block;margin-bottom:34px;font-weight:700;letter-spacing:.08em;color:inherit;text-decoration:none}.login h1{font-size:clamp(30px,6vw,42px);line-height:1.08;margin:10px 0}.login p{color:#a9adbd;line-height:1.65}.login label{display:block;margin:18px 0 8px;font-size:13px}.login input{box-sizing:border-box;width:100%;padding:13px 14px;border:1px solid #414454;border-radius:10px;background:#10121a;color:#fff;font:inherit}.login button{box-sizing:border-box;width:100%;padding:13px;margin-top:12px;border:0;border-radius:10px;background:#d6b47a;color:#171820;font:inherit;font-weight:650;cursor:pointer}.login button:disabled{opacity:.55}.login .quiet{background:transparent;color:#c5c7d2;border:1px solid #414454}.login .msg{min-height:24px;font-size:13px;color:#e7bd82}.hidden,[hidden]{display:none!important}</style></head><body><main class="login"><a class="brand" href="/">✳ AKVISIO / STORYBOARD STUDIO</a><p class="eyebrow">RUANG KERJA PRIBADI</p><h1 id="title">Masuk ke studio.</h1><p id="sub">Gunakan email untuk menerima kode masuk satu kali. Tanpa kata sandi.</p><form id="form" novalidate><div id="emailRow"><label for="email">Alamat email</label><input id="email" name="email" type="email" autocomplete="username webauthn" autocapitalize="off" required placeholder="nama@contoh.com"></div><div id="codeRow" hidden><label for="code">Kode 6 digit</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456"></div><button id="submit" type="submit">Kirim kode masuk</button><button class="quiet" id="back" type="button" hidden>Ganti email</button></form><div id="passkey" hidden><p>Tambahkan passkey agar masuk berikutnya lebih cepat dengan biometrik atau kunci layar perangkat.</p><button id="passkeyAdd" type="button">Tambahkan passkey</button><button class="quiet" id="passkeySkip" type="button">Nanti saja</button></div><p class="msg" id="msg" role="status" aria-live="polite"></p></main><script>
(function(){'use strict';var A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),emailRow=document.getElementById('emailRow'),codeRow=document.getElementById('codeRow'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg'),title=document.getElementById('title'),sub=document.getElementById('sub'),passkey=document.getElementById('passkey'),step='email',hasPasskey=false;function say(t){msg.textContent=t||''}function next(){var n=new URLSearchParams(location.search).get('next')||'/';if(n.charAt(0)!=='/'||n.charAt(1)==='/'||n.includes('\\'))n='/';for(var i=0;i<n.length;i++){var c=n.charCodeAt(i);if(c<32||c===127){n='/';break}}location.replace(n)}function declined(){try{return localStorage.getItem('storyboard_passkey_declined')==='1'}catch(e){return false}}function finish(){if(hasPasskey||declined()||!A.registerPasskey||!A.supportsPasskeys||!A.supportsPasskeys()){next();return}form.hidden=true;title.textContent='Akun siap digunakan';sub.textContent='Anda sudah masuk. Tambahkan passkey untuk masuk lebih mudah di lain waktu.';passkey.hidden=false}if(!A){say('Layanan masuk belum tersedia. Muat ulang halaman.');submit.disabled=true;return}A.getSession().then(function(s){if(s&&s.user)next()}).catch(function(){});if(A.attachPasskeyAutofill){try{A.attachPasskeyAutofill(email).then(function(r){if(r&&r.user)next()}).catch(function(){})}catch(e){}}back.addEventListener('click',function(){step='email';emailRow.hidden=false;codeRow.hidden=true;back.hidden=true;submit.textContent='Kirim kode masuk';code.required=false;say('');email.focus()});form.addEventListener('submit',async function(e){e.preventDefault();if(step==='passkey')return;submit.disabled=true;try{if(step==='email'){if(!email.value.trim()){say('Masukkan alamat email.');return}var r=await A.startLogin({email:email.value.trim()});hasPasskey=!!(r&&r.has_passkey);step='code';emailRow.hidden=true;codeRow.hidden=false;back.hidden=false;code.required=true;submit.textContent='Verifikasi dan masuk';sub.textContent='Masukkan kode yang dikirim ke '+email.value.trim()+'.';code.focus();say('Kode dikirim jika alamat dapat diverifikasi.')}else{var done=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!done||!done.user)throw new Error('Kode tidak valid.');finish()}}catch(err){say(err&&err.status===429?'Terlalu banyak percobaan. Coba lagi sebentar lagi.':(err.message||'Tidak dapat masuk. Periksa email dan kode.'))}finally{submit.disabled=false}});document.getElementById('passkeyAdd').addEventListener('click',async function(){try{await A.registerPasskey();next()}catch(err){say(err.message||'Passkey tidak dapat dibuat. Anda tetap dapat melanjutkan tanpa passkey.')}});document.getElementById('passkeySkip').addEventListener('click',function(){try{localStorage.setItem('storyboard_passkey_declined','1')}catch(e){}next()});})();
</script></body></html>
