<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11131b"><title>Masuk · AI Storyboard Studio</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(100%,460px);padding:clamp(24px,5vw,42px);background:#191b25;border:1px solid #333644;border-radius:20px}.login .brand{display:block;margin-bottom:34px;font-weight:700;letter-spacing:.08em}.login h1{font-size:clamp(30px,6vw,42px);line-height:1.08;margin:10px 0}.login p{color:#a9adbd;line-height:1.65}.login label{display:block;margin:18px 0 8px;font-size:13px}.login input{width:100%;padding:13px 14px;border:1px solid #414454;border-radius:10px;background:#10121a;color:#fff;font:inherit}.login button{width:100%;margin-top:16px}.login .msg{min-height:24px;font-size:13px;color:#e7bd82}.login a{color:#d5b178}.hidden{display:none!important}</style></head><body><main class="login"><a class="brand" href="/">✳ AKVISIO / STORYBOARD STUDIO</a><p class="eyebrow">RUANG KERJA PRIBADI</p><h1 id="title">Masuk ke studio.</h1><p id="sub">Gunakan email untuk menerima kode masuk satu kali. Proyek Anda dipisahkan dari pengguna lain.</p><form id="form"><div id="emailRow"><label for="email">Alamat email</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="nama@contoh.com"></div><div id="codeRow" class="hidden"><label for="code">Kode 6 digit</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required></div><button class="btn btn-primary" id="submit" type="submit">Kirim kode masuk</button><button class="btn btn-quiet hidden" id="back" type="button">Ganti email</button></form><div id="passkey" class="hidden"><p>Tambahkan passkey agar masuk berikutnya lebih cepat dengan biometrik atau kunci layar perangkat.</p><button class="btn btn-primary" id="passkeyAdd" type="button">Tambahkan passkey</button><button class="btn btn-quiet" id="passkeySkip" type="button">Nanti saja</button></div><p class="msg" id="msg" role="status" aria-live="polite"></p></main><script>
(function(){var A=window.hatchable&&window.hatchable.auth,form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),emailRow=document.getElementById('emailRow'),codeRow=document.getElementById('codeRow'),submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg'),passkey=document.getElementById('passkey'),hasPasskey=false,step='email';function say(t){msg.textContent=t||''}function next(){var n=new URLSearchParams(location.search).get('next')||'/';if(n.charAt(0)!=='/'||n.charAt(1)==='/'||n.includes('\\')||/[\u0000-\u001f\u007f]/.test(n))n='/';location.replace(n)}if(!A){say('Layanan masuk belum tersedia. Muat ulang halaman.');submit.disabled=true;return}A.getSession().then(function(s){if(s&&s.user)next()}).catch(function(){});form.addEventListener('submit',async function(e){e.preventDefault();submit.disabled=true;try{if(step==='email'){var r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{var p=await A.signInWithPasskey({email:email.value.trim()});if(p&&p.user){next();return}}catch(err){}}step='code';emailRow.classList.add('hidden');codeRow.classList.remove('hidden');back.classList.remove('hidden');submit.textContent='Verifikasi dan masuk';code.required=true;code.focus();say('Kode masuk dikirim jika email dapat diverifikasi.')}else{var done=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!done||!done.user)throw new Error('Kode tidak valid.');if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem('storyboard_passkey_declined')!=='1'){form.classList.add('hidden');document.getElementById('title').textContent='Akun siap digunakan';document.getElementById('sub').textContent='Anda sudah masuk. Tambahkan passkey untuk masuk lebih mudah di lain waktu.';passkey.classList.remove('hidden')}else next()}}catch(err){say(err&&err.status===429?'Terlalu banyak percobaan. Coba lagi sebentar lagi.':(err.message||'Tidak dapat masuk. Periksa email dan kode.'))}finally{submit.disabled=false}});back.addEventListener('click',function(){step='email';emailRow.classList.remove('hidden');codeRow.classList.add('hidden');back.classList.add('hidden');submit.textContent='Kirim kode masuk';code.required=false;say('')});document.getElementById('passkeyAdd').addEventListener('click',async function(){try{await A.registerPasskey({name:'AI Storyboard Studio'});next()}catch(err){say(err.message||'Passkey tidak dapat dibuat.');}});document.getElementById('passkeySkip').addEventListener('click',function(){localStorage.setItem('storyboard_passkey_declined','1');next()});})();
</script></body></html>
